<!doctype html><html><body style="margin:0;background:#cfe3f0"><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { createAnimal, SPECIES } from '/src/chars/animals.js';
import { createJudy, createNick } from '/src/chars/heroes.js';
const W = 1600, H = 900;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(W, H); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xcfe3f0);
sc.add(new THREE.HemisphereLight(0xffffff, 0x8a7a60, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(4, 8, 6); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 8, bottom: -2 }); sun.shadow.mapSize.set(2048, 2048); sc.add(sun);
const g = new THREE.Mesh(new THREE.PlaneGeometry(60, 20), new THREE.MeshStandardMaterial({ color: 0xbdb5a4 })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; sc.add(g);
const q = new URLSearchParams(location.search);
const list = (q.get('s') || 'judy,nick,rabbit,fox,lion,tiger,zebra,sheep,cheetah,wolf,pig').split(',');
const detail = q.get('d') || 'hi';
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
let x = 0; const objs = [];
for (const k of list) {
  const m = k === 'judy' ? createJudy() : k === 'nick' ? createNick() : createAnimal(k, { seed: 3, outfit: q.get('o') || undefined, detail });
  const h = m.userData.height || 1;
  const s = 1.25 / Math.max(1.0, h * 0.6);
  m.scale.setScalar(s);
  m.traverse(o => { if (o.isMesh) o.castShadow = true; });
  m.position.x = x; m.rotation.y = 0.35;
  x += 1.05; sc.add(m); objs.push(m);
}
const cx = (x - 1.05) / 2;
cam.position.set(cx, 1.3, 7.2); cam.lookAt(cx, 0.75, 0);
for (let i = 0; i < 10; i++) for (const o of objs) o.userData.update?.(0.05, 0);
r.render(sc, cam);
window.__ready = true;
</script></body></html>
